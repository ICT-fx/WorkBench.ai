name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Tests
        run: npm test
      # Le build valide les données publiées : un classement corrompu ne peut
      # pas atteindre la production sans faire échouer la CI.
      - name: Build du site
        run: npm run build --workspace=@hub/web
